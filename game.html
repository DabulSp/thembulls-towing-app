<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Thembulls Towing LLC - Towing Simulator</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; color: white; text-align: center; background: radial-gradient(circle at top, #333 0%, #111 45%, #000 100%); touch-action: manipulation; }
    header { padding: 16px; background: #000; border-bottom: 4px solid #f4b400; }
    h1 { margin: 0; color: #f4b400; font-size: clamp(24px, 6vw, 40px); }
    header p { margin: 6px 0 0; font-size: clamp(14px, 3.5vw, 18px); }
    main { width: min(95%, 650px); margin: auto; padding: 15px 10px; }
    #game-container { background: #1b1b1b; border: 2px solid #f4b400; border-radius: 8px; padding: 10px; margin: 10px 0; box-shadow: 0 4px 15px rgba(244, 180, 0, 0.2); }
    #gameCanvas { background: #222; border: 2px solid #333; border-radius: 4px; display: block; margin: 0 auto; max-width: 100%; height: auto; }
    .game-stats { display: flex; justify-content: space-around; margin-top: 10px; font-size: 16px; font-weight: bold; color: #f4b400; flex-wrap: wrap; gap: 5px; }
    .btn-restart { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #f4b400; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    .btn-restart:active { background: #ffcc00; }
    .touch-controls { margin-top: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .touch-row { display: flex; justify-content: center; gap: 12px; }
    .touch-btn { width: 65px; height: 55px; font-size: 20px; font-weight: bold; background: #f4b400; color: #000; border: none; border-radius: 8px; display: flex; align-items: center; justify-content: center; touch-action: none; }
    .touch-btn:active { background: #ffcc00; transform: scale(0.95); }
    footer { padding: 15px; background: #000; border-top: 1px solid #222; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <header>
    <h1>Thembulls Towing LLC</h1>
    <p>Fast, Reliable & Professional Towing Services</p>
  </header>
  <main>
    <div id="game-container">
      <canvas id="gameCanvas" width="600" height="400"></canvas>
      <div class="game-stats">
        <span>Tows: <span id="score">0</span></span>
        <span>Time: <span id="timer">60</span>s</span>
        <span>Status: <span id="status">Tap Start to begin shift!</span></span>
      </div>
      <button class="btn-restart" onclick="resetGame()">Start / Restart Shift</button>
      <div class="touch-controls">
        <div class="touch-row"><button class="touch-btn" id="btnUp">▲</button></div>
        <div class="touch-row">
          <button class="touch-btn" id="btnLeft">◀</button>
          <button class="touch-btn" id="btnDown">▼</button>
          <button class="touch-btn" id="btnRight">▶</button>
        </div>
      </div>
    </div>
  </main>
  <footer><p>&copy; 2026 Thembulls Towing LLC. All rights reserved.</p></footer>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const statusEl = document.getElementById('status');
    let score = 0;
    let timeLeft = 60;
    let gameActive = false;
    let timerInterval = null;
    let hasCar = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const truck = { x: 300, y: 350, width: 24, height: 45, angle: 0, speed: 0, maxSpeed: 4.5, accel: 0.18, friction: 0.05, turnSpeed: 0.05 };
    let target = { x: 100, y: 100, width: 20, height: 35 };
    const dropZone = { x: 480, y: 30, width: 90, height: 90 };
    let pedestrians = [];
    for (let i = 0; i < 5; i++) {
      pedestrians.push({ x: Math.random() * 500 + 50, y: Math.random() * 300 + 50, dx: (Math.random() - 0.5) * 1.5, dy: (Math.random() - 0.5) * 1.5, radius: 5 });
    }
    let police = { x: 50, y: 200, dx: 2, dy: 0, width: 22, height: 40 };

    function spawnTarget() {
      target.x = Math.random() * (canvas.width - 160) + 60;
      target.y = Math.random() * (canvas.height - 160) + 100;
    }

    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.ArrowUp = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.ArrowDown = true;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.ArrowLeft = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.ArrowRight = true;
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.ArrowUp = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.ArrowDown = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.ArrowLeft = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.ArrowRight = false;
    });

    function setupTouchBtn(id, keyName) {
      const btn = document.getElementById(id);
      const start = e => { e.preventDefault(); keys[keyName] = true; };
      const end = e => { e.preventDefault(); keys[keyName] = false; };
      btn.addEventListener('touchstart', start);
      btn.addEventListener('touchend', end);
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }
    setupTouchBtn('btnUp', 'ArrowUp');
    setupTouchBtn('btnDown', 'ArrowDown');
    setupTouchBtn('btnLeft', 'ArrowLeft');
    setupTouchBtn('btnRight', 'ArrowRight');

    function resetGame() {
      score = 0; timeLeft = 60; hasCar = false; gameActive = true;
      truck.x = 300; truck.y = 350; truck.speed = 0; truck.angle = 0;
      scoreEl.innerText = score; timerEl.innerText = timeLeft;
      statusEl.innerText = 'Shift active! Pick up stranded cars.';
      spawnTarget();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!gameActive) return;
        timeLeft--;
        timerEl.innerText = timeLeft;
        if (timeLeft <= 0) {
          gameActive = false;
          clearInterval(timerInterval);
          statusEl.innerText = 'Shift Ended! Tows: ' + score;
          playBeep(200, 'sawtooth', 0.5);
        }
      }, 1000);
    }

    function update() {
      if (!gameActive) return;
      if (keys.ArrowUp) {
        if (truck.speed < truck.maxSpeed) truck.speed += truck.accel;
      } else if (keys.ArrowDown) {
        if (truck.speed > -truck.maxSpeed / 2) truck.speed -= truck.accel;
      } else {
        if (truck.speed > 0) truck.speed -= truck.friction;
        if (truck.speed < 0) truck.speed += truck.friction;
        if (Math.abs(truck.speed) < truck.friction) truck.speed = 0;
      }
      if (truck.speed !== 0) {
        const dir = truck.speed > 0 ? 1 : -1;
        if (keys.ArrowLeft) truck.angle -= truck.turnSpeed * dir;
        if (keys.ArrowRight) truck.angle += truck.turnSpeed * dir;
      }
      truck.x += Math.sin(truck.angle) * truck.speed;
      truck.y -= Math.cos(truck.angle) * truck.speed;
      truck.x = Math.max(15, Math.min(canvas.width - 15, truck.x));
      truck.y = Math.max(15, Math.min(canvas.height - 15, truck.y));

      pedestrians.forEach(p => {
        p.x += p.dx; p.y += p.dy;
        if (p.x < 10 || p.x > canvas.width - 10) p.dx *= -1;
        if (p.y < 10 || p.y > canvas.height - 10) p.dy *= -1;
        if (Math.hypot(truck.x - p.x, truck.y - p.y) < 18) {
          timeLeft = Math.max(0, timeLeft - 3);
          p.x = Math.random() * (canvas.width - 50) + 25;
          p.y = Math.random() * (canvas.height - 50) + 25;
          statusEl.innerText = 'Watch for pedestrians! (-3s Penalty)';
          playBeep(150, 'sawtooth', 0.2);
        }
      });

      police.x += police.dx;
      if (police.x < 30 || police.x > canvas.width - 120) police.dx *= -1;

      if (!hasCar && Math.hypot(truck.x - target.x, truck.y - target.y) < 28) {
        hasCar = true;
        statusEl.innerText = 'Vehicle Hooked! Transport to Drop Zone';
        playBeep(600, 'sine', 0.2);
      }
      if (hasCar && truck.x > dropZone.x && truck.x < dropZone.x + dropZone.width && truck.y > dropZone.y && truck.y < dropZone.y + dropZone.height) {
        hasCar = false; score++; timeLeft += 5;
        scoreEl.innerText = score; timerEl.innerText = timeLeft;
        statusEl.innerText = 'Tow Delivered! (+5s)';
        playBeep(880, 'triangle', 0.3);
        spawnTarget();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#2d2d2d'; ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
      for (let i = 0; i < canvas.height; i += 40) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

      ctx.fillStyle = 'rgba(244, 180, 0, 0.2)'; ctx.strokeStyle = '#f4b400'; ctx.lineWidth = 2;
      ctx.fillRect(dropZone.x, dropZone.y, dropZone.width, dropZone.height);
      ctx.strokeRect(dropZone.x, dropZone.y, dropZone.width, dropZone.height);
      ctx.fillStyle = '#f4b400'; ctx.font = '12px Arial';
      ctx.fillText('DROP ZONE', dropZone.x + 12, dropZone.y + 50);

      if (!hasCar) {
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(target.x - target.width / 2, target.y - target.height / 2, target.width, target.height);
      }

      ctx.fillStyle = '#ffffff';
      pedestrians.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); });

      ctx.fillStyle = '#3498db';
      ctx.fillRect(police.x, police.y, police.width, police.height);
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(police.x + 4, police.y + 15, 14, 10);

      ctx.save();
      ctx.translate(truck.x, truck.y);
      ctx.rotate(truck.angle);
      ctx.fillStyle = '#555';
      ctx.fillRect(-truck.width / 2, -truck.height / 2, truck.width, truck.height);
      ctx.fillStyle = '#f4b400';
      ctx.fillRect(-truck.width / 2, -truck.height / 2, truck.width, 15);
      if (hasCar) {
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(-target.width / 2, 2, target.width, target.height - 10);
      }
      ctx.restore();

      if (!gameActive && timeLeft <= 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f4b400'; ctx.font = '28px Arial'; ctx.textAlign = 'center';
        ctx.fillText('SHIFT COMPLETE!', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '18px Arial'; ctx.fillStyle = '#fff';
        ctx.fillText('Tows Delivered: ' + score, canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
    gameLoop();
  </script>
</body>
</html>
